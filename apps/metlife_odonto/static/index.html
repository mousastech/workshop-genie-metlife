<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MetLife Odonto · Cotação</title>
<style>
  :root{--navy:#002B5C;--blue:#0090DA;--green:#25D366;--wa:#075E54;--bg:#e5ddd5;--ink:#0c1b2e}
  *{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:#eef3f9;color:var(--ink)}
  .top{background:linear-gradient(135deg,#002B5C,#0090DA);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px}
  .top .m{background:#fff;color:#0090DA;font-weight:900;padding:2px 8px;border-radius:6px}
  .top b{font-size:18px}.top small{opacity:.85}
  .wrap{max-width:460px;margin:22px auto;padding:0 12px}
  .phone{border:1px solid #d5dee8;border-radius:22px;overflow:hidden;box-shadow:0 12px 40px rgba(0,43,92,.18);background:#fff}
  .wahead{background:var(--wa);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
  .wahead .av{width:38px;height:38px;border-radius:50%;background:#0090DA;display:grid;place-items:center;font-size:20px}
  .wahead b{font-size:15px}.wahead small{opacity:.8;font-size:12px}
  .chat{background:var(--bg);background-image:linear-gradient(rgba(229,221,213,.6),rgba(229,221,213,.6));height:60vh;min-height:420px;overflow-y:auto;padding:14px}
  .msg{max-width:80%;padding:8px 12px;border-radius:10px;margin:6px 0;font-size:14px;line-height:1.4;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.08)}
  .bot{background:#fff;border-top-left-radius:2px}
  .me{background:#dcf8c6;margin-left:auto;border-top-right-radius:2px}
  .plan{background:#fff;border:2px solid var(--green);border-radius:12px;padding:12px;margin:8px 0}
  .plan h4{margin:0 0 4px;color:var(--navy)}.plan .price{font-size:20px;font-weight:800;color:#1f8f43}
  .plan .tag{display:inline-block;background:#eaf7ee;color:#1f8f43;font-weight:700;font-size:11px;padding:2px 8px;border-radius:999px}
  .bar{display:flex;gap:8px;padding:10px;background:#f0f3f6;border-top:1px solid #e2e9f2}
  .bar input{flex:1;padding:11px 14px;border:1px solid #d5dee8;border-radius:22px;font-size:14px}
  .bar button{background:var(--green);color:#fff;border:0;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer}
  .quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 10px;background:#f0f3f6}
  .quick button{background:#fff;border:1px solid #cfe0d6;color:var(--wa);border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer}
  .foot{max-width:460px;margin:10px auto;text-align:center;color:#5b6b80;font-size:12px}
</style></head>
<body>
<div class="top"><span class="m">MetLife</span><b>Odonto · Cotação</b><small>· via WhatsApp (simulador)</small></div>
<div class="wrap"><div class="phone">
  <div class="wahead"><div class="av">🦷</div><div><b>MetLife Odonto</b><br><small>assistente de cotação • online</small></div></div>
  <div class="chat" id="chat"></div>
  <div class="quick" id="quick"></div>
  <div class="bar"><input id="inp" placeholder="Digite sua mensagem…" autocomplete="off"/><button id="send">➤</button></div>
</div>
<div class="foot">Simulador do fluxo que rodará no WhatsApp (fase 2). Cada resposta é gravada no Lakebase; ao final, o melhor plano é ofertado.</div>
</div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const chat=document.getElementById('chat'), inp=document.getElementById('inp'), send=document.getElementById('send'), quick=document.getElementById('quick');
let sid = 'sim-'+Math.random().toString(36).slice(2,10);
function bubble(txt,cls){const d=document.createElement('div');d.className='msg '+cls;d.textContent=txt;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function planCard(p){const d=document.createElement('div');d.className='plan';
  d.innerHTML=`<span class="tag">${p.destaque||'Recomendado'}</span><h4>${p.nome} · ${p.cobertura}</h4>
  <div class="price">R$ ${p.total.toFixed(2)}/mês</div>
  <div style="color:#5b6b80;font-size:13px">R$ ${p.preco_por_vida.toFixed(2)}/vida × ${p.vidas} · carência ${p.carencia} meses</div>
  <div style="font-size:13px;margin-top:6px">🦷 ${p.rede}</div>`;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function quicks(items){quick.innerHTML='';items.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{inp.value=t;doSend();};quick.appendChild(b);});}
let lastId=0, polling=null;
function startPolling(){
  if(polling) return;
  polling=setInterval(async()=>{
    const r=await fetch(`/api/mensagens/${sid}?after=${lastId}`); const ms=await r.json();
    if(Array.isArray(ms)) ms.forEach(m=>{ lastId=Math.max(lastId,m.id);
      if(m.origem==='operador') bubble('👨‍⚕️ Consultor: '+m.texto,'bot'); });
  },3000);
}
async function doSend(){
  const txt=inp.value.trim(); if(txt){bubble(txt,'me');} inp.value=''; quick.innerHTML='';
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,mensagem:txt})});
  const d=await r.json();
  if(d.error){bubble('⚠️ '+d.error,'bot');return;}
  if(d.reply) bubble(d.reply,'bot');
  if(d.plano) planCard(d.plano);
  const q=(d.reply||'').toLowerCase();
  if(q.includes('começar')||q.includes('lgpd')) quicks(['sim','não']);
  else if(q.includes('individual')||q.includes('família')) quicks(['Individual','Família']);
  else if(q.includes('cobertura')) quicks(['1','2','3']);
  else if(q.includes('faz sentido')||q.includes('operador')) quicks(['sim','não']);
  else if(q.includes('reiniciar')) quicks(['reiniciar']);
  if(q.includes('consultor')||q.includes('transferir')) startPolling();  // handoff → recebe msgs do operador
}
send.onclick=doSend; inp.addEventListener('keydown',e=>{if(e.key==='Enter')doSend();});
doSend();
</script>
</body></html>
