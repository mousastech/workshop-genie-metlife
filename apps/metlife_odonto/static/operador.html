<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MetLife Odonto · Console do Operador</title>
<style>
  :root{--navy:#002B5C;--blue:#0090DA;--green:#25D366;--bg:#eef3f9;--card:#fff;--line:#e2e9f2;--ink:#0c1b2e;--muted:#5b6b80}
  *{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  .top{background:linear-gradient(135deg,#002B5C,#0090DA);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px}
  .top .m{background:#fff;color:#0090DA;font-weight:900;padding:2px 8px;border-radius:6px}.top b{font-size:17px}
  .top .who{margin-left:auto;font-size:13px}.top input{border:0;border-radius:8px;padding:6px 10px}
  .grid{display:grid;grid-template-columns:340px 1fr;gap:0;height:calc(100vh - 52px)}
  .fila{background:#f4f7fb;border-right:1px solid var(--line);overflow-y:auto}
  .item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .item:hover{background:#e9f1f9}.item.on{background:#e2eefb;border-left:4px solid var(--blue)}
  .item b{color:var(--navy)}.item .meta{font-size:12px;color:var(--muted);margin-top:3px}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800;color:#fff}
  .b-solicitado{background:#FFA600}.b-em_atendimento{background:#0090DA}
  .painel{display:flex;flex-direction:column;height:100%}
  .cab{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
  .cab .dados{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
  .cab .dados b{color:var(--navy)}
  .conv{flex:1;overflow-y:auto;padding:16px;background:#e5ddd5}
  .msg{max-width:75%;padding:8px 12px;border-radius:10px;margin:6px 0;font-size:14px;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.08)}
  .cliente{background:#fff}.bot{background:#eef7ff}.operador{background:#dcf8c6;margin-left:auto}
  .rol{font-size:11px;color:var(--muted);margin-bottom:2px}
  .form{display:flex;gap:8px;padding:12px;background:#f0f3f6;border-top:1px solid var(--line)}
  .form input{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:22px}
  .btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
  .btn-p{background:linear-gradient(135deg,#0090DA,#25D366);color:#fff}.btn-g{background:#fff;border:1px solid var(--line);color:var(--navy)}
  .empty{display:grid;place-items:center;height:100%;color:var(--muted)}
</style></head>
<body>
<div class="top"><span class="m">MetLife</span><b>Odonto · Console do Operador</b>
  <span class="who">Operador: <input id="op" value="Consultor MetLife"/></span></div>
<div class="grid">
  <div class="fila" id="fila"></div>
  <div class="painel" id="painel"><div class="empty">Selecione uma conversa na fila →</div></div>
</div>
<script>
let sel=null, lastId=0, tConv=null;
const fila=document.getElementById('fila'), painel=document.getElementById('painel'), opIn=document.getElementById('op');
const brl=n=>n==null?'-':'R$ '+Number(n).toLocaleString('pt-BR',{maximumFractionDigits:2});
async function carregarFila(){
  const r=await fetch('/api/atendimento/lista'); const d=await r.json();
  fila.innerHTML = (Array.isArray(d)&&d.length)? '' : '<div class="empty" style="height:auto;padding:20px">Nenhuma conversa aguardando.</div>';
  (d||[]).forEach(c=>{const el=document.createElement('div');el.className='item'+(sel===c.session_id?' on':'');
    el.innerHTML=`<b>${c.nome||c.session_id}</b> <span class="badge b-${c.handoff}">${c.handoff}</span>
      <div class="meta">${c.perfil||''} · ${c.vidas||1} vida(s) · ${c.uf||''} · plano: <b>${c.plano_recomendado||'-'}</b> (${brl(c.preco_estimado)}/mês)</div>`;
    el.onclick=()=>abrir(c); fila.appendChild(el);});
}
async function abrir(c){
  sel=c.session_id; lastId=0; carregarFila();
  painel.innerHTML=`<div class="cab"><b style="color:#002B5C">${c.nome||sel}</b>
    <div class="dados"><span>Perfil: <b>${c.perfil||'-'}</b></span><span>Vidas: <b>${c.vidas||1}</b></span>
    <span>UF: <b>${c.uf||'-'}</b></span><span>Cobertura: <b>${c.cobertura_desejada||'-'}</b></span>
    <span>Plano: <b>${c.plano_recomendado||'-'}</b> (${brl(c.preco_estimado)}/mês)</span></div></div>
    <div class="conv" id="conv"></div>
    <div class="form"><input id="msg" placeholder="Escreva para o cliente…" autocomplete="off"/>
      <button class="btn btn-p" id="env">Enviar</button><button class="btn btn-g" id="fim">Concluir</button></div>`;
  document.getElementById('env').onclick=enviar;
  document.getElementById('fim').onclick=concluir;
  document.getElementById('msg').addEventListener('keydown',e=>{if(e.key==='Enter')enviar();});
  if(tConv) clearInterval(tConv); tConv=setInterval(puxarMsgs,2500); puxarMsgs();
}
async function puxarMsgs(){
  if(!sel) return;
  const r=await fetch(`/api/mensagens/${sel}?after=${lastId}`); const ms=await r.json();
  const conv=document.getElementById('conv'); if(!conv||!Array.isArray(ms)) return;
  ms.forEach(m=>{lastId=Math.max(lastId,m.id);
    const d=document.createElement('div');d.className='msg '+m.origem;
    d.innerHTML=`<div class="rol">${m.origem==='cliente'?'Cliente':m.origem==='bot'?'Bot':'Você'}</div>${m.texto}`;
    conv.appendChild(d);conv.scrollTop=conv.scrollHeight;});
}
async function enviar(){
  const i=document.getElementById('msg'); const t=i.value.trim(); if(!t)return; i.value='';
  await fetch('/api/atendimento/responder',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({session_id:sel,operador:opIn.value,texto:t})});
  puxarMsgs(); carregarFila();
}
async function concluir(){
  await fetch('/api/atendimento/concluir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sel})});
  sel=null; painel.innerHTML='<div class="empty">Atendimento concluído. Selecione outra conversa →</div>'; carregarFila();
}
carregarFila(); setInterval(carregarFila,5000);
</script>
</body></html>
